# Redis Sentinel configuration for 3-node HA cluster
port 26379
dir /data

# Monitor master
sentinel monitor jukebox-master redis-1 6379 2
sentinel auth-pass jukebox-master ${REDIS_PASSWORD}

# Timing parameters
sentinel down-after-milliseconds jukebox-master 5000
sentinel failover-timeout jukebox-master 30000
sentinel parallel-syncs jukebox-master 1

# DNS resolution (critical for Docker/Kubernetes)
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Security
sentinel deny-scripts-reconfig yes

# Logging
logfile /var/log/redis/sentinel.log
loglevel notice

# Client limits
maxclients 10000
