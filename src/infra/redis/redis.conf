# Redis master configuration
port 6379
bind 0.0.0.0
protected-mode yes
requirepass ${REDIS_PASSWORD}

# Persistence
save 60 1
save 300 10
save 900 100
dbfilename dump.rdb
dir /data

# Memory
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logging
loglevel warning
logfile /var/log/redis/redis.log

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Replication
repl-diskless-sync yes
repl-diskless-sync-delay 5
